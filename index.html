<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApartemenKu - Premium Apartment Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen" x-data="apartemenApp()">

    <!-- Header -->
    <header class="border-b border-amber-900/40 bg-slate-900/70 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-500 to-amber-300 flex items-center justify-center font-bold text-xl text-slate-950 shadow-lg shadow-amber-500/20">
                    🏢
                </div>
                <div>
                    <h1 class="text-lg font-bold bg-gradient-to-r from-amber-200 to-amber-400 bg-clip-text text-transparent">ApartemenKu Suite</h1>
                    <p class="text-xs text-amber-500/80">Premium Residence & Unit Management</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="px-3 py-1 bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-semibold rounded-full flex items-center gap-1.5">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    Turso Cloud DB Active
                </span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Metrics Bar -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
            <div class="bg-slate-900/60 border border-amber-900/30 p-5 rounded-2xl">
                <p class="text-xs text-slate-400 mb-1">Total Unit Apartemen</p>
                <h3 class="text-2xl font-bold text-white" x-text="units.length">12</h3>
            </div>
            <div class="bg-slate-900/60 border border-amber-900/30 p-5 rounded-2xl">
                <p class="text-xs text-slate-400 mb-1">Unit Tersewa</p>
                <h3 class="text-2xl font-bold text-amber-400" x-text="units.filter(u => u.status === 'Tersewa').length">8</h3>
            </div>
            <div class="bg-slate-900/60 border border-amber-900/30 p-5 rounded-2xl">
                <p class="text-xs text-slate-400 mb-1">Unit Available</p>
                <h3 class="text-2xl font-bold text-emerald-400" x-text="units.filter(u => u.status === 'Available').length">4</h3>
            </div>
            <div class="bg-slate-900/60 border border-amber-900/30 p-5 rounded-2xl">
                <p class="text-xs text-slate-400 mb-1">Pendapatan Sewa Bulanan</p>
                <h3 class="text-2xl font-bold text-cyan-400" x-text="formatRupiah(totalRevenue)">Rp 48.000.000</h3>
            </div>
        </div>

        <!-- Content Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- List Unit Apartemen -->
            <div class="lg:col-span-2 space-y-4">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <span>🏢</span> Unit Residence & Status Tenant
                    </h2>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <template x-for="unit in units" :key="unit.id">
                        <div class="bg-slate-900/40 border border-slate-800 hover:border-amber-500/50 p-5 rounded-2xl transition-all group">
                            <div class="flex justify-between items-start mb-3">
                                <div>
                                    <span class="text-xs font-bold text-amber-400 uppercase tracking-wider" x-text="unit.code">Tower A - Unit 12B</span>
                                    <h4 class="text-sm font-semibold text-white mt-0.5" x-text="unit.tenantName || 'Belum Ada Penghuni'">Bapak Edgar</h4>
                                </div>
                                <span class="px-2.5 py-1 text-[10px] font-bold rounded-lg uppercase"
                                      :class="unit.status === 'Tersewa' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30'"
                                      x-text="unit.status">
                                </span>
                            </div>
                            <div class="space-y-1.5 text-xs text-slate-400 mb-4">
                                <div class="flex justify-between">
                                    <span>Tipe Unit:</span>
                                    <span class="text-slate-200" x-text="unit.type">2 BR + Balkon City View</span>
                                </div>
                                <div class="flex justify-between">
                                    <span>Sewa / Bulan:</span>
                                    <span class="text-cyan-400 font-semibold" x-text="formatRupiah(unit.price)">Rp 6.000.000</span>
                                </div>
                            </div>
                            <div class="pt-3 border-t border-slate-800/80 flex gap-2">
                                <button @click="generateInvoice(unit)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-2 rounded-xl transition-colors font-medium">
                                    📜 Cetak Tagihan Sewa
                                </button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- Panel Generator Invoice Apartemen Live -->
            <div class="bg-slate-900/80 border border-amber-900/40 p-6 rounded-3xl h-fit sticky top-24">
                <h3 class="text-sm font-bold text-white mb-4 flex items-center gap-2">
                    <span>⚡</span> Billing Invoice Preview
                </h3>

                <template x-if="selectedUnit">
                    <div class="bg-slate-950 border border-slate-800 p-5 rounded-2xl space-y-4">
                        <div class="border-b border-slate-800 pb-3">
                            <p class="text-[10px] text-amber-500/80 uppercase tracking-widest">APARTEMENKU RESIDENCE BILL</p>
                            <h4 class="text-base font-bold text-white" x-text="'APT-' + Math.floor(100000 + Math.random() * 900000)">APT-992104</h4>
                        </div>
                        <div class="space-y-2 text-xs">
                            <div class="flex justify-between text-slate-400">
                                <span>Penghuni:</span>
                                <span class="text-white font-semibold" x-text="selectedUnit.tenantName">Bapak Edgar</span>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>Unit:</span>
                                <span class="text-amber-400 font-semibold" x-text="selectedUnit.code">Tower A - Unit 12B</span>
                            </div>
                            <div class="flex justify-between text-slate-400">
                                <span>Periode Sewa:</span>
                                <span class="text-slate-300" x-text="new Date().toLocaleDateString('id-ID', { month: 'long', year: 'numeric' })"></span>
                            </div>
                        </div>
                        <div class="pt-3 border-t border-slate-800 flex justify-between items-center">
                            <span class="text-xs text-slate-400 font-semibold font-mono">Total Tagihan:</span>
                            <span class="text-base font-bold text-emerald-400" x-text="formatRupiah(selectedUnit.price)">Rp 6.000.000</span>
                        </div>
                        <button @click="alert('Tagihan Apartemen berhasil dikirim ke WhatsApp Tenant!')" class="w-full bg-gradient-to-r from-amber-500 to-amber-400 text-slate-950 font-bold text-xs py-2.5 rounded-xl shadow-lg shadow-amber-500/20 transition-all hover:opacity-90">
                            📲 Kirim Tagihan Apartemen
                        </button>
                    </div>
                </template>

                <template x-if="!selectedUnit">
                    <div class="text-center py-12 text-slate-500 text-xs">
                        Pilih tombol "Cetak Tagihan Sewa" pada unit apartemen untuk melihat invoice live.
                    </div>
                </template>
            </div>

        </div>
    </main>

    <script>
        function apartemenApp() {
            return {
                selectedUnit: null,
                units: [
                    { id: 1, code: 'Tower A - Unit 12B', tenantName: 'Bapak Edgar', type: '2 BR Premium', price: 6000000, status: 'Tersewa' },
                    { id: 2, code: 'Tower A - Unit 15C', tenantName: 'Dr. Rian Hidayat', type: 'Penthouse Suite', price: 12000000, status: 'Tersewa' },
                    { id: 3, code: 'Tower A - Unit 08A', tenantName: '', type: 'Studio Room', price: 4000000, status: 'Available' },
                    { id: 4, code: 'Tower B - Unit 20D', tenantName: 'Siti Rahmawati', type: '2 BR Corner', price: 7000000, status: 'Tersewa' },
                    { id: 5, code: 'Tower B - Unit 05B', tenantName: '', type: 'Studio Room', price: 4000000, status: 'Available' },
                    { id: 6, code: 'Tower B - Unit 18A', tenantName: 'Kevin Wijaya', type: '1 BR Executive', price: 5000000, status: 'Tersewa' }
                ],
                get totalRevenue() {
                    return this.units.filter(u => u.status === 'Tersewa').reduce((sum, u) => sum + u.price, 0);
                },
                formatRupiah(number) {
                    return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
                },
                generateInvoice(unit) {
                    this.selectedUnit = unit;
                }
            }
        }
    </script>
</body>
</html>
